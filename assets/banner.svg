<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#101d42"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Text Visibility -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
    
    /* Animations */
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatPlane {
      0% { transform: translate(0px, 0px); }
      50% { transform: translate(15px, -10px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.9; }
    }

    .flight-path {
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 8 6;
      animation: dash 12s linear infinite;
      fill: none;
      opacity: 0.6;
    }

    .radar-circle { stroke: #38bdf8; stroke-width: 1; fill: none; opacity: 0.2; }
    .radar-sweep-line {
      transform-origin: 1050px 120px;
      animation: rotateSweep 8s linear infinite;
    }

    .animated-node {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: center;
    }

    .blinking-dot {
      animation: blink 2s ease-in-out infinite;
    }

    .plane-icon {
      animation: floatPlane 6s ease-in-out infinite;
    }

    /* Typography */
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: url(#text-grad);
      filter: url(#shadow);
    }

    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e2e8f0;
      filter: url(#shadow);
    }

    .tagline {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 14px;
      fill: #94a3b8;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" class="bg" rx="16"/>

  <!-- Background Grid -->
  <line x1="100" y1="0" x2="100" y2="400" class="grid-line"/>
  <line x1="300" y1="0" x2="300" y2="400" class="grid-line"/>
  <line x1="500" y1="0" x2="500" y2="400" class="grid-line"/>
  <line x1="700" y1="0" x2="700" y2="400" class="grid-line"/>
  <line x1="900" y1="0" x2="900" y2="400" class="grid-line"/>
  <line x1="1100" y1="0" x2="1100" y2="400" class="grid-line"/>

  <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
  <line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>
  <line x1="0" y1="320" x2="1200" y2="320" class="grid-line"/>

  <!-- Background Radar Vector (Positioned in Top Right, subtle opacity behind text overlay boundary) -->
  <g transform="translate(50, 0)">
    <circle cx="1000" cy="120" r="100" class="radar-circle"/>
    <circle cx="1000" cy="120" r="60" class="radar-circle"/>
    <circle cx="1000" cy="120" r="20" class="radar-circle"/>
    <g class="radar-sweep-line">
      <path d="M1000,120 L1100,120 A100,100 0 0,0 1000,20 Z" fill="url(#radar-sweep)"/>
    </g>
    <!-- Blinking Radar Targets -->
    <circle cx="970" cy="90" r="4" fill="#38bdf8" class="blinking-dot"/>
    <circle cx="1040" cy="140" r="3" fill="#818cf8" class="blinking-dot" style="animation-delay: 0.8s;"/>
    <circle cx="1010" cy="70" r="3" fill="#c084fc" class="blinking-dot" style="animation-delay: 1.4s;"/>
  </g>

  <!-- Flight Path Lines -->
  <path d="M-50,280 Q 300,120 600,220 T 1250,140" class="flight-path"/>
  <path d="M-50,340 Q 400,200 800,300 T 1250,220" class="flight-path" style="stroke: #818cf8; stroke-dasharray: 6 8; animation-duration: 16s;"/>

  <!-- Floating Airplane Graphic -->
  <g class="plane-icon" transform="translate(820, 150)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#38bdf8" transform="scale(1.8) rotate(45)"/>
  </g>

  <!-- Decorative Hub Nodes -->
  <circle cx="200" cy="245" r="6" fill="#38bdf8" class="animated-node"/>
  <circle cx="600" cy="220" r="6" fill="#818cf8" class="animated-node" style="animation-delay: 1s;"/>
  <circle cx="950" cy="178" r="6" fill="#c084fc" class="animated-node" style="animation-delay: 2s;"/>

  <!-- Foreground Content (Title & Subtitle positioned cleanly in foreground) -->
  <g transform="translate(80, 130)">
    <!-- Top Tagline -->
    <text x="0" y="0" class="tagline">✈️ AVIATION SOFTWARE ARCHITECTURE &amp; OPERATIONAL INTELLIGENCE</text>
    
    <!-- Main Title -->
    <text x="0" y="55" class="title">Awesome Airport Operations</text>
    
    <!-- Subtitle -->
    <text x="0" y="102" class="subtitle">Top SaaS Platforms &amp; Open-Source Projects for Airport Management</text>

    <!-- Sub-badges text -->
    <g transform="translate(0, 135)">
      <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="18" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🛫 A-CDM Systems</text>

      <rect x="147" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="161" y="18" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#818cf8">📊 FIDS Software</text>

      <rect x="294" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="308" y="18" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#c084fc">🧳 Ground Handling</text>

      <rect x="461" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="475" y="18" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#4ade80">🏢 AODB Control</text>
    </g>
  </g>
</svg>
